# OrbStack:  HOST_PORT=7700 docker compose up --build -d   ->  http://127.0.0.1:7700
# The server binds 0.0.0.0 INSIDE the container (A2ALAB_BIND is the opt-in), but the port is published on loopback only.
# Do not change the 127.0.0.1 below. HOST_PORT must stay in 7700-7709.
name: a2a-lab

services:
  a2a-lab:
    build: .
    ports:
      - "127.0.0.1:${HOST_PORT:-7700}:7700"
    environment:
      PORT: "7700"
      A2ALAB_BIND: 0.0.0.0
      SHELF_URL: ${SHELF_URL:-https://local.ping-devops.com:8443/demo-shelf}
      LAB_ALLOWED_HOSTS: ${LAB_ALLOWED_HOSTS:-a2a-lab.local.ping-devops.com}
      # Rule 27 run observability: a LOOPBACK Elasticsearch URL and a read-only key. Empty by default. Real mode is reserved in this lab, so nothing reads them yet. Never mount the Docker socket.
      RUN_OBS_ES_URL: ${RUN_OBS_ES_URL:-}
      RUN_OBS_ES_READ_APIKEY: ${RUN_OBS_ES_READ_APIKEY:-}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7700/api/health').then(r=>r.json()).then(j=>process.exit(j.schema==='demo-health/1'&&j.state==='ready'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      start_period: 5s
      start_interval: 2s
      timeout: 5s
      retries: 3
